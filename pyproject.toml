[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdx-data"
version = "0.1.0"
description = "把通达信 vipdoc K 线导入 Parquet"
requires-python = ">=3.11"
dependencies = ["pyarrow>=15"]

[project.scripts]
tdx-import = "tdx_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
